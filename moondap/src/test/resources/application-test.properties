# [TEST] 테스트 전용 설정
#
# 운영/개발 설정은 비밀값을 환경변수로 주입받고 기본값이 없다(docs/SECRETS.md 참고).
# 테스트는 개발자 머신의 환경변수에 의존하면 안 되므로, 여기서 더미 값을 채운다.
# 실제 비밀값을 절대 넣지 말 것.
#
# 사용법: 테스트 클래스에 @ActiveProfiles("test") 를 붙인다.

# --- 플레이스홀더 충족용 더미 값 ---
DB_USERNAME=test
DB_PASSWORD=test
ADMIN_SECRET_KEY=test-admin-key

# --- DataSource ---
# 실제로 접속하지 않는다. HikariCP 는 첫 쿼리 시점에 커넥션을 열므로
# 컨텍스트 로딩만 검증하는 테스트에서는 연결이 발생하지 않는다.
# 포트를 13306 으로 둔 것은 로컬 MySQL(3306)이나 운영 DB에 실수로 붙는 것을 막기 위함이다.
spring.datasource.url=jdbc:mysql://127.0.0.1:13306/moondap_test

# --- 파일 업로드 경로 ---
# 개발자 홈 디렉터리를 오염시키지 않도록 임시 경로를 사용한다.
file.upload-dir=${java.io.tmpdir}/moondap-test/contents/
file.profile-dir=${java.io.tmpdir}/moondap-test/profiles/

# --- 로깅 ---
logging.level.com.moondap=WARN
