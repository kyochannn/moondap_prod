<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{/layout/main_layout}">

<head>
    <meta charset="UTF-8">
    <title>캘린더 - 관리자</title>
    <link th:href="@{/assets/css/test-admin-common.css}" rel="stylesheet">
    <link th:href="@{/assets/css/admin-calendar.css}" rel="stylesheet">
    <!-- 캘린더 렌더링을 위한 cdn -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <!-- index.global.min.js 는 로케일 데이터를 포함하지 않아 locale: 'ko' 만으로는
         버튼/요일 표기가 영어로 남는다. 로케일 전용 스크립트를 따로 불러온다. -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/ko.global.min.js"></script>
</head>

<body layout:fragment="content">
    <main class="main">
        <section class="section">
            <div class="container" data-aos="fade-up">

                <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
                    <div>
                        <h4 class="fw-bold text-white mb-1">📅 공유 캘린더</h4>
                        <p id="upcomingEventSummary" class="text-white-50 mb-0 small"></p>
                    </div>
                    <button type="button" class="btn btn-primary btn-icon btn-circle"
                            data-bs-toggle="modal" data-bs-target="#eventModal"
                            onclick="resetEventModal()"
                            title="새 일정 추가" aria-label="새 일정 추가">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                </div>

                <div id="calendar"></div>

            </div>
        </section>
    </main>

    <!-- 현재 로그인한 관리자 정보. 새 일정 모달에 "이 계정으로 등록된다"를 보여주는 데만 쓴다. -->
    <div id="currentAdminMeta" class="d-none"
         th:data-username="${#authentication.name}"
         th:data-nickname="${#authentication.principal.user.nickname}"
         th:data-profile-image="${#authentication.principal.user.profileImage}"></div>

    <!-- 일정 추가/수정 모달 -->
    <div class="modal fade" id="eventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="eventForm">
                    <input type="hidden" id="eventId" name="id">
                    <div class="modal-body pt-4">
                        <div class="mb-3 d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center gap-2">
                                <img id="eventAuthorAvatar" src="" alt=""
                                     style="width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,0.4);">
                                <span id="eventAuthorName" class="small text-white-50"></span>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <div class="form-check d-flex align-items-center gap-2 mb-0">
                                    <input type="checkbox" class="form-check-input mt-0" id="eventCompleted" name="completed">
                                    <label class="form-check-label small text-white-50 mb-0" for="eventCompleted">완료</label>
                                </div>
                                <div class="form-check d-flex align-items-center gap-2 mb-0">
                                    <input type="checkbox" class="form-check-input mt-0" id="eventShared" name="shared">
                                    <label class="form-check-label small text-white-50 mb-0" for="eventShared">공통 일정</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-white-50">제목</label>
                            <input type="text" class="form-control" id="eventTitle" name="title" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small text-white-50">시작일</label>
                                <input type="date" class="form-control" id="eventStartAt" name="startAt" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small text-white-50">종료일</label>
                                <input type="date" class="form-control" id="eventEndAt" name="endAt" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-white-50">색상</label>
                            <div class="d-flex align-items-center gap-2">
                                <input type="color" class="form-control form-control-color"
                                       id="eventColor" name="color" title="일정 색상">
                                <div class="d-flex gap-2" id="colorSwatches"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-white-50">설명</label>
                            <textarea class="form-control" id="eventDescription" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-light btn-icon btn-circle" data-bs-dismiss="modal"
                                title="취소" aria-label="취소">
                            <i class="bi bi-x-lg"></i>
                        </button>
                        <div class="d-flex gap-2">
                            <button type="button" id="btnDeleteEvent" class="btn btn-danger btn-icon btn-circle d-none"
                                    title="삭제" aria-label="삭제"
                                    onclick="if(confirm('정말 삭제하시겠습니까?')) deleteCalendarEvent(document.getElementById('eventId').value)">
                                <i class="bi bi-trash"></i>
                            </button>
                            <button type="submit" class="btn btn-primary btn-icon btn-circle" title="저장" aria-label="저장">
                                <i class="bi bi-check-lg"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // 작성자(username)를 고정 팔레트에 해시로 매핑한다. DB에 색을 저장하지 않으므로
        // 관리자 계정이 늘어도 스키마/설정 변경 없이 새 색이 자동으로 배정된다.
        // 모달의 "즐겨찾기 색" 도 같은 팔레트를 재사용한다 — 기준 색이 두 군데서 따로
        // 관리되면 시간이 지나며 어긋나기 쉽다.
        var EVENT_COLOR_PALETTE = ['#865EF4', '#38bdf8', '#f87171', '#34d399', '#fbbf24'];
        // 공통 일정은 작성자가 누구든 같은 중립 색으로 통일해서, 보자마자
        // "개인 일정이 아니라 같이 보는 일정"임을 색만으로 구분할 수 있게 한다.
        var SHARED_EVENT_COLOR = '#64748b';
        function colorForAuthor(username) {
            var hash = 0;
            for (var i = 0; i < username.length; i++) {
                hash = (hash * 31 + username.charCodeAt(i)) | 0;
            }
            return EVENT_COLOR_PALETTE[Math.abs(hash) % EVENT_COLOR_PALETTE.length];
        }

        // header.html 의 프로필 사진 분기와 동일한 기준: 값이 비어 있거나 기본 이미지
        // 파일명 그대로면 /profile/ 경로가 아니라 공용 기본 아바타를 쓴다.
        function avatarSrcForAuthor(profileImage) {
            if (profileImage && profileImage !== 'default-profile-img.svg') {
                return '/profile/' + profileImage;
            }
            return '/assets/img/default-img/default-profile-img.svg';
        }

        // 배경색 밝기에 따라 글자색을 검정/흰색으로 바꾼다. 즐겨찾기 색 외에도
        // 사용자가 네이티브 색상 피커로 아무 색이나 고를 수 있어서, 흰색 글자 고정으로는
        // 밝은 배경(예: 연노랑)에서 제목이 안 보이는 문제가 생긴다.
        function textColorForBackground(hex) {
            hex = (hex || '').replace('#', '');
            if (hex.length !== 6) {
                return '#ffffff';
            }
            var r = parseInt(hex.substring(0, 2), 16);
            var g = parseInt(hex.substring(2, 4), 16);
            var b = parseInt(hex.substring(4, 6), 16);
            // YIQ 공식으로 체감 밝기를 구한다. 150 을 기준으로 밝으면 어두운 글자,
            // 어두우면 밝은 글자를 쓴다.
            var brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 150 ? '#1a1a2e' : '#ffffff';
        }

        // "yyyy-MM-dd" 문자열에 날짜를 더/빼기. 시간 없는 날짜 문자열을 new Date() 로
        // 바로 파싱하면 로컬 타임존에 따라 하루가 밀릴 수 있어 UTC 자정으로 고정해 계산한다.
        function shiftDate(dateStr, days) {
            var d = new Date(dateStr + 'T00:00:00Z');
            d.setUTCDate(d.getUTCDate() + days);
            return d.toISOString().slice(0, 10);
        }

        var currentAdminMeta = document.getElementById('currentAdminMeta');
        var CURRENT_ADMIN_USERNAME = currentAdminMeta.dataset.username;
        var CURRENT_ADMIN_NICKNAME = currentAdminMeta.dataset.nickname;
        var CURRENT_ADMIN_PROFILE_IMAGE = currentAdminMeta.dataset.profileImage;

        // 새 일정은 지금 로그인한 계정이 작성자가 되고(서비스가 서버에서 강제한다),
        // 기존 일정은 처음 만든 사람이 계속 작성자다(수정해도 안 바뀜) — 그래서
        // 새로 열 때와 수정으로 열 때 서로 다른 값을 넣어준다. 화면에는 username(로그인 id)
        // 이 아니라 닉네임을 보여준다 — username 은 색상 해시(colorForAuthor)에만 쓴다.
        function setAuthorDisplay(nickname, profileImage) {
            document.getElementById('eventAuthorAvatar').src = avatarSrcForAuthor(profileImage);
            document.getElementById('eventAuthorName').textContent = nickname;
        }

        // 2024-06-09 기준 100일 단위 기념일. 날짜 계산만 하면 되는 표시용 정보라
        // 서버/DB 없이 고정값으로 둔다. 날짜를 바꿔야 하면 이 상수만 고치면 된다.
        var ANNIVERSARY_START_MS = new Date('2024-06-09T00:00:00').getTime();

        // 주어진 날짜가 100일 단위 기념일(100, 200, 300...)이면 그 일수를,
        // 아니면 null 을 돌려준다. "다음 기념일 하나"만 계산하면 그 달을 벗어난
        // 다음 기념일(예: 1000일)이 다른 달에서는 아예 안 보이므로, 달력이 그리는
        // 날짜 칸마다 그 날짜 자체로 독립적으로 판정한다.
        function anniversaryMilestoneFor(date) {
            var daysSince = Math.round((date.getTime() - ANNIVERSARY_START_MS) / 86400000) + 1;
            return (daysSince >= 100 && daysSince % 100 === 0) ? daysSince : null;
        }

        // 대한민국 공휴일(2026·2027). 설날/추석/부처님오신날은 음력 기준이라 계산식으로
        // 구할 수 없고, 대체공휴일 규정도 매년 조건이 달라 날짜를 직접 박아둔다.
        // DB에 넣지 않은 이유: 사용자가 앱에서 만들거나 고치는 데이터가 아니라
        // 개발자가 연 1회 갱신하는 고정 참고값이라, 캘린더 일정(md_calendar_event)과
        // 같은 테이블/상호작용(드래그·완료 체크·삭제)을 가질 이유가 없다.
        // 다음 해 분이 필요해지면 이 객체에 추가하면 된다.
        var KOREAN_HOLIDAYS = {
            '2026-01-01': '신정',
            '2026-02-16': '설날', '2026-02-17': '설날', '2026-02-18': '설날',
            '2026-03-01': '삼일절', '2026-03-02': '삼일절 대체공휴일',
            '2026-05-01': '노동절',
            '2026-05-05': '어린이날',
            '2026-05-24': '부처님오신날', '2026-05-25': '부처님오신날 대체공휴일',
            '2026-06-06': '현충일',
            '2026-07-17': '제헌절',
            '2026-08-15': '광복절', '2026-08-17': '광복절 대체공휴일',
            '2026-09-24': '추석', '2026-09-25': '추석', '2026-09-26': '추석',
            '2026-10-03': '개천절', '2026-10-05': '개천절 대체공휴일',
            '2026-10-09': '한글날',
            '2026-12-25': '크리스마스',

            '2027-01-01': '신정',
            '2027-02-06': '설날', '2027-02-07': '설날', '2027-02-08': '설날',
            '2027-02-09': '설날 대체공휴일',
            '2027-03-01': '삼일절',
            '2027-05-01': '노동절', '2027-05-03': '노동절 대체공휴일',
            '2027-05-05': '어린이날',
            '2027-05-13': '부처님오신날',
            '2027-06-06': '현충일',
            '2027-07-17': '제헌절', '2027-07-19': '제헌절 대체공휴일',
            '2027-08-15': '광복절', '2027-08-16': '광복절 대체공휴일',
            '2027-09-14': '추석', '2027-09-15': '추석', '2027-09-16': '추석',
            '2027-10-03': '개천절', '2027-10-04': '개천절 대체공휴일',
            '2027-10-09': '한글날', '2027-10-11': '한글날 대체공휴일',
            '2027-12-25': '크리스마스', '2027-12-27': '크리스마스 대체공휴일'
        };

        function holidayNameFor(date) {
            return KOREAN_HOLIDAYS[dateToStr(date)] || null;
        }

        function renderColorSwatches() {
            var container = document.getElementById('colorSwatches');
            EVENT_COLOR_PALETTE.forEach(function (hex) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'color-swatch-btn';
                btn.style.backgroundColor = hex;
                btn.title = hex;
                btn.addEventListener('click', function () {
                    document.getElementById('eventColor').value = hex;
                });
                container.appendChild(btn);
            });
        }

        // 오늘 날짜를 로컬 기준 "yyyy-MM-dd" 로. new Date().toISOString() 은 UTC 기준이라
        // 자정 근처(한국은 UTC+9)에는 날짜가 하루 어긋날 수 있다.
        function dateToStr(d) {
            var mm = String(d.getMonth() + 1).padStart(2, '0');
            var dd = String(d.getDate()).padStart(2, '0');
            return d.getFullYear() + '-' + mm + '-' + dd;
        }

        function todayDateStr() {
            return dateToStr(new Date());
        }

        // 헤더 아래 작은 안내문에 "가장 가까운(오늘 포함, 미래) 일정"을 날짜와 함께 보여준다.
        // 캘린더가 현재 보고 있는 달과 무관하게 전체 일정 중에서 찾아야 하므로,
        // FullCalendar 의 내부 이벤트 목록(현재 보이는 달로 범위가 좁혀질 수 있다)이 아니라
        // /admin/calendar/events 를 따로 한 번 더 불러 직접 계산한다.
        function loadUpcomingEventSummary() {
            fetch('/admin/calendar/events')
                .then(function (res) { return res.json(); })
                .then(renderUpcomingEventSummary)
                .catch(function (err) { console.error(err); });
        }

        function renderUpcomingEventSummary(events) {
            var el = document.getElementById('upcomingEventSummary');
            var today = todayDateStr();

            // 여러 날짜에 걸친 일정(end 가 오늘 이후)은 start 가 오늘보다 과거여도
            // 오늘 진행 중인 일정이다. start 만 보고 거르면 이런 일정이 통째로 빠진다.
            var ongoingToday = events.filter(function (e) { return e.start <= today && e.end >= today; });
            if (ongoingToday.length > 0) {
                var titles = ongoingToday.map(function (e) { return e.title; });
                el.textContent = '오늘 · ' + titles.join(', ');
                return;
            }

            var future = events.filter(function (e) { return e.start > today; });
            if (future.length === 0) {
                el.textContent = '예정된 일정이 없어요';
                return;
            }

            var nearestDate = future.reduce(function (min, e) {
                return e.start < min ? e.start : min;
            }, future[0].start);

            var titlesOnNearestDate = future
                .filter(function (e) { return e.start === nearestDate; })
                .map(function (e) { return e.title; });

            var parts = nearestDate.split('-');
            var dateLabel = (parts[0] === String(new Date().getFullYear()) ? '' : parts[0] + '년 ')
                + Number(parts[1]) + '월 ' + Number(parts[2]) + '일';

            el.textContent = dateLabel + ' · ' + titlesOnNearestDate.join(', ');
        }

        var calendar;

        document.addEventListener('DOMContentLoaded', function () {
            renderColorSwatches();
            loadUpcomingEventSummary();

            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'ko',
                initialView: 'dayGridMonth',
                height: 820,
                // 기본은 "today" 버튼과 "prev,next" 버튼이 따로 떨어진 두 묶음이다.
                // prev,today,next 를 콤마로 묶어 "< today >" 처럼 한 덩어리로 보이게 한다.
                // 월별 보기만 쓰므로 주/일 보기 전환 버튼(right)은 아예 없앤다.
                headerToolbar: {
                    left: 'title',
                    center: '',
                    right: 'prev,today,next'
                },
                buttonText: {
                    today: 'today'
                },
                // 드래그로 날짜 이동, 가장자리를 끌어 기간 조절. 체크박스 클릭처럼
                // 움직임 없는 클릭은 FullCalendar 가 드래그로 보지 않으므로 기존
                // eventClick/체크박스 토글 동작과 섞이지 않는다.
                editable: true,
                events: '/admin/calendar/events',
                // 날짜만 쓰는 일정이라 종일(all-day) 로 그린다.
                // "color" 는 FullCalendar 가 알아보는 표준 필드라 backgroundColor/borderColor
                // 양쪽에 그대로 적용된다. 일정에 직접 지정한 색이 있으면 그걸 쓰고,
                // 없으면(과거 데이터 포함) 작성자 해시 기반 기본 색으로 대체한다.
                // end 는 DB/폼 기준 "마지막 날 포함"이지만 FullCalendar all-day 이벤트는
                // end 를 배타적으로 해석하므로 하루를 더해 넘긴다.
                eventDataTransform: function (raw) {
                    raw.allDay = true;
                    raw.color = raw.shared ? SHARED_EVENT_COLOR : (raw.color || colorForAuthor(raw.authorUsername || ''));
                    raw.end = shiftDate(raw.end, 1);
                    return raw;
                },
                // 날짜 칸 숫자를 "1일" 이 아니라 "1" 로만 보여준다. ko 로케일의 기본
                // Intl 포맷이 day-of-month 에 "일" 단위를 붙이기 때문에 직접 그린다.
                // 공휴일이면 숫자 옆에 "[공휴일] 이름" 을 같은 줄에 붙인다. 이 콜백이
                // 채우는 영역(.fc-daygrid-day-number)은 날짜 칸 전체가 아니라 숫자를
                // 감싼 좁은 박스라, 기념일 배지처럼 따로 떼어 오른쪽 끝으로 밀 필요
                // 없이 여기서 그냥 이어 붙이면 자연스럽게 숫자 옆에 자리잡는다.
                dayCellContent: function (arg) {
                    var dayNumber = arg.date.getDate();
                    var holidayName = holidayNameFor(arg.date);
                    var html = '<span class="' + (holidayName ? 'fc-holiday-day-number' : '') + '">' + dayNumber + '</span>';
                    if (holidayName) {
                        html += '<span class="fc-holiday-label">[공휴일] ' + escapeHtml(holidayName) + '</span>';
                    }
                    return { html: html };
                },
                // 기념일 배지는 dayCellContent 안(날짜 숫자 앵커 내부)에 넣으면 그
                // 앵커가 이미 가진 좁은 박스 기준으로 위치가 잡혀 숫자 바로 옆에
                // 붙어버린다. 셀의 실제 루트 엘리먼트(arg.el)에 직접 자식으로
                // 붙여야 셀 전체를 기준으로 오른쪽 상단에 고정된다.
                dayCellDidMount: function (arg) {
                    var milestone = anniversaryMilestoneFor(arg.date);
                    if (!milestone) {
                        return;
                    }
                    var badge = document.createElement('span');
                    badge.className = 'fc-anniversary-badge';
                    badge.textContent = milestone;
                    arg.el.appendChild(badge);
                },
                // 커스텀 렌더링이라 FullCalendar 의 기본 텍스트 이스케이프를 거치지 않는다.
                // 제목은 사용자가 입력한 문자열이므로 반드시 escapeHtml 을 거쳐야 한다.
                eventContent: function (arg) {
                    var completed = !!arg.event.extendedProps.completed;
                    var shared = !!arg.event.extendedProps.shared;
                    var textColor = textColorForBackground(arg.event.backgroundColor);
                    // 공통 일정은 "누구 것"이 아니므로 작성자 아바타 대신 공유 아이콘을 보여준다.
                    var avatarHtml = shared
                        ? '<i class="bi bi-people-fill fc-event-avatar fc-event-shared-icon"></i>'
                        : '<img class="fc-event-avatar" src="' + avatarSrcForAuthor(arg.event.extendedProps.authorProfileImage) + '" alt="">';
                    var html = '<div class="fc-event-main-custom' + (completed ? ' fc-event-done' : '') + '" style="color:' + textColor + '">'
                        + avatarHtml
                        + '<span class="fc-event-title-custom">' + escapeHtml(arg.event.title) + '</span>'
                        + '<input type="checkbox" class="fc-event-complete-checkbox"' + (completed ? ' checked' : '') + '>'
                        + '</div>';
                    return { html: html };
                },
                dateClick: function (info) {
                    resetEventModal();
                    document.getElementById('eventStartAt').value = info.dateStr;
                    document.getElementById('eventEndAt').value = info.dateStr;
                    new bootstrap.Modal(document.getElementById('eventModal')).show();
                },
                eventClick: function (info) {
                    // 체크박스 클릭은 완료 토글만 하고 수정 모달은 열지 않는다.
                    // 체크박스는 클릭 시 FullCalendar 로 버블링되기 전에 이미 checked 값이
                    // 바뀌어 있으므로 그 값을 그대로 저장한다.
                    if (info.jsEvent.target.classList.contains('fc-event-complete-checkbox')) {
                        toggleEventCompleted(info.event.id, info.jsEvent.target.checked);
                        return;
                    }
                    var event = info.event;
                    document.getElementById('eventId').value = event.id;
                    document.getElementById('eventTitle').value = event.title;
                    document.getElementById('eventDescription').value = event.extendedProps.description || '';
                    document.getElementById('eventStartAt').value = event.startStr;
                    // eventDataTransform 에서 더한 하루를 다시 뺀다(화면에는 "마지막 날 포함" 기준으로 보여준다).
                    document.getElementById('eventEndAt').value = shiftDate(event.endStr, -1);
                    document.getElementById('eventColor').value = event.backgroundColor;
                    document.getElementById('eventShared').checked = !!event.extendedProps.shared;
                    document.getElementById('eventCompleted').checked = !!event.extendedProps.completed;
                    setAuthorDisplay(event.extendedProps.authorNickname, event.extendedProps.authorProfileImage);
                    document.getElementById('btnDeleteEvent').classList.remove('d-none');
                    new bootstrap.Modal(document.getElementById('eventModal')).show();
                },
                eventDrop: persistReschedule,
                eventResize: persistReschedule
            });
            calendar.render();
        });

        function resetEventModal() {
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('eventColor').value = EVENT_COLOR_PALETTE[0];
            setAuthorDisplay(CURRENT_ADMIN_NICKNAME, CURRENT_ADMIN_PROFILE_IMAGE);
            document.getElementById('btnDeleteEvent').classList.add('d-none');
        }

        document.getElementById('eventForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var formData = new FormData(this);
            var id = formData.get('id');
            var url = id ? '/admin/calendar/events/update' : '/admin/calendar/events/create';

            fetch(url, {
                method: 'POST',
                headers: window.mdCsrf.headers(),
                body: formData
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.success) {
                    // 카테고리 관리 화면은 location.reload() 로 목록을 갱신하지만,
                    // FullCalendar 는 인스턴스를 다시 만들 필요 없이 refetchEvents() 로
                    // 바로 새 일정을 반영할 수 있어 그쪽을 쓴다.
                    bootstrap.Modal.getInstance(document.getElementById('eventModal')).hide();
                    calendar.refetchEvents();
                    loadUpcomingEventSummary();
                } else {
                    alert(data.message);
                }
            })
            .catch(function (err) {
                console.error(err);
                alert('처리 중 오류가 발생했습니다.');
            });
        });

        function deleteCalendarEvent(id) {
            fetch('/admin/calendar/events/delete/' + id, {
                method: 'POST',
                headers: window.mdCsrf.headers()
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('eventModal')).hide();
                    calendar.refetchEvents();
                    loadUpcomingEventSummary();
                } else {
                    alert(data.message);
                }
            })
            .catch(function (err) {
                console.error(err);
                alert('삭제 중 오류가 발생했습니다.');
            });
        }

        // 드래그 이동(eventDrop)과 가장자리로 기간 조절(eventResize) 둘 다 같은 모양의
        // info 객체({event, revert})를 넘겨주므로 한 함수로 처리한다.
        function persistReschedule(info) {
            var startAt = info.event.startStr;
            // eventDataTransform 에서 더한 하루를 다시 뺀다(서버는 "마지막 날 포함" 기준).
            var endAt = shiftDate(info.event.endStr, -1);

            fetch('/admin/calendar/events/' + info.event.id + '/reschedule'
                    + '?startAt=' + encodeURIComponent(startAt)
                    + '&endAt=' + encodeURIComponent(endAt), {
                method: 'POST',
                headers: window.mdCsrf.headers()
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (!data.success) {
                    alert(data.message);
                    info.revert();
                } else {
                    loadUpcomingEventSummary();
                }
            })
            .catch(function (err) {
                console.error(err);
                info.revert();
            });
        }

        function toggleEventCompleted(id, completed) {
            fetch('/admin/calendar/events/' + id + '/complete?completed=' + completed, {
                method: 'POST',
                headers: window.mdCsrf.headers()
            })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (!data.success) {
                    alert(data.message);
                }
                // 실패 시에도 체크박스가 이미 눈으로는 바뀐 상태라, 서버 기준으로 다시 그려
                // 화면과 DB 상태를 맞춘다.
                calendar.refetchEvents();
            })
            .catch(function (err) {
                console.error(err);
                calendar.refetchEvents();
            });
        }
    </script>
</body>

</html>
