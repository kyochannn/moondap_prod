<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{/layout/main_layout}"
      >
<!-- layout:decorate="~{/레이아웃 경로/레이아웃 파일명}" -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테스트로 만나는 또 다른 나, 문답</title>
    <style type="text/css">
		.bg-unselected {
		    background-color: #383838 !important;
		    background-image: none !important;
		}
		
		/* 링크 복사 토스트 스타일 */
		#copyToast {
		    visibility: hidden;
		    min-width: 200px;
		    background-color: #ffffff;
		    color: #000000;
		    text-align: center;
		    border-radius: 10px;
		    padding: 12px 24px;
		    position: fixed;
		    z-index: 10000;
		    bottom: 50px;
		    left: 50%;
		    transform: translateX(-50%);
		    font-weight: bold;
		    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
		}
		
		#copyToast.show {
		    visibility: visible;
		    -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
		    animation: fadein 0.5s, fadeout 0.5s 2.5s;
		}
		
		@-webkit-keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 50px; opacity: 1; } }
		@keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 50px; opacity: 1; } }
		@-webkit-keyframes fadeout { from { bottom: 50px; opacity: 1; } to { bottom: 0; opacity: 0; } }
		@keyframes fadeout { from { bottom: 50px; opacity: 1; } to { bottom: 0; opacity: 0; } }

		/* ── 추천 테스트 (가로형 리스트) ────────────────────────
		   댓글을 지나온 뒤 위치라 세로 카드로는 너무 길어진다.
		   한 항목을 90px 안팎으로 유지해 3개가 한눈에 들어오게 한다. */
		.rec-list { display: flex; flex-direction: column; gap: 10px; }

		.rec-item {
			display: flex; align-items: center; gap: 12px;
			padding: 10px; text-decoration: none;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.08);
			border-radius: 14px;
			transition: background .2s ease, transform .2s ease;
		}
		.rec-item:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }

		.rec-thumb {
			position: relative; flex: 0 0 72px;
			width: 72px; height: 72px; border-radius: 10px; overflow: hidden;
			background: linear-gradient(135deg, #2a2550, #1b1b3a);
			display: flex; align-items: center; justify-content: center;
		}
		.rec-thumb img { width: 100%; height: 100%; object-fit: cover; }
		.rec-thumb-fallback { color: rgba(255, 255, 255, 0.35); font-size: 1.6rem; }

		.rec-new {
			position: absolute; top: 4px; left: 4px;
			background: #ff4d6d; color: #fff;
			font-size: 0.55rem; font-weight: 700;
			padding: 1px 5px; border-radius: 6px;
		}

		.rec-body { flex: 1 1 auto; min-width: 0; }
		.rec-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
		.rec-cat {
			font-size: 0.68rem; color: #b9b4ff;
			background: rgba(124, 117, 255, 0.15);
			padding: 1px 7px; border-radius: 20px;
		}
		.rec-play { font-size: 0.68rem; color: #ffc107; }

		/* 제목·설명이 길어도 한 줄로 잘라 높이를 고정한다 */
		.rec-title {
			color: #fff; font-weight: 700; font-size: 0.92rem;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
		.rec-desc {
			color: rgba(255, 255, 255, 0.5); font-size: 0.75rem;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}

		.rec-arrow { color: rgba(255, 255, 255, 0.3); flex: 0 0 auto; }

		/* ── 댓글 정렬 ──────────────────────────────────────── */
		.comment-sort {
			display: flex;
			justify-content: flex-end;
			gap: 14px;
			padding: 0 6px 8px;
		}

		.comment-sort-link {
			background: none;
			border: none;
			padding: 2px 0;
			font-size: 0.82rem;
			color: rgba(255, 255, 255, 0.45);
			cursor: pointer;
		}

		.comment-sort-link.active {
			color: #fff;
			font-weight: 700;
		}

		.comment-sort-link:hover { color: rgba(255, 255, 255, 0.8); }
    </style>
    <script th:inline="javascript"> 
        // 서버에서 넘겨준 현재 게임 ID
        const gameId = /*[[${balanceGame.id}]]*/ 'default';
        const spicyFilter = /*[[${balanceGame.isSpicy ? 1 : 0}]]*/ 0;
        const category = /*[[${balanceGame.category}]]*/ 'all';
        const isAnonymous = /*[[${isAnonymous}]]*/ false;
        const currentUserId = /*[[${currentUserId}]]*/ '';
        const isAdmin = /*[[${#authorization.expression('hasAuthority("ROLE_ADMIN")')}]]*/ false;
        
    	/*
    	 * 다시 선택하기까지의 대기 시간.
    	 *
    	 * 서버는 재투표를 표 이동으로 정확히 처리하므로 집계가 틀어질 걱정은 없다.
    	 * 이 대기는 결과를 본 직후 좌우를 연타하며 퍼센트가 튀는 것을 막기 위한 것이다.
    	 *
    	 * (이전 값 1/4 * 60000 은 주석에 "약 20초"라고 적혀 있었지만 실제로는 15초였다.)
    	 */
    	const VOTE_COOLDOWN_MS = 15 * 1000;
    	// 사용자 nickname
       	let nickname = '';
    	
    	// 좋아요 처리 중인 댓글 번호를 추적 (중복 클릭 방지)
    	const processingLikeComments = {};
    	
    
    	document.addEventListener('DOMContentLoaded', function() {
			
    		// 화면이 처음 로드될 때 최상단으로 이동하도록 설정
    		if ('scrollRestoration' in history) {
    		    history.scrollRestoration = 'manual';
    		}
    		window.scrollTo(0, 0);
    		
	        if (isAlreadyVoted()) {
	    		// 투표를 진행한 이력이 있다면
	            // 선택 창 클릭 금지
	            $('.option1Content, .option2Content').css('pointer-events', 'none'); 
	            
	            // 사용자가 이전에 뭘 했는지 정보 가져오기
	            const votedGames = JSON.parse(localStorage.getItem('moondap_voted_games') || '{}');
	            const side = votedGames[gameId].side;
		        
	            // 예전 투표 결과 디스플레이
    			applyVoteResultStyle(side);
    			
    			// 다시하기 버튼 활성화 (대기 시간이 남아 있으면 카운트다운 상태로 표시)
    			$('#resetVoteBtn').fadeIn();
    			startCooldownCountdown();

    			// 결과 퍼센트 바 활성화
    			$('#balance-game-progressbar-container').fadeIn();
    			
    			// 채팅창 활성화
    			$('#balance-game-chat-container').fadeIn();

    			// 추천 테스트도 투표 후에만 보여준다.
    			// 투표 전에 노출하면 참여하기도 전에 나갈 길을 먼저 주는 셈이다.
    			$('#recommend-tests').fadeIn();
    			
    			// 댓글 그리기
    	        selectBalanceGameComment(false);
    			
	        } else {
	        	
	        	// 투표를 진행한 이력이 없다면
	        	// 다시하기 버튼 비활성화
	        	$('#resetVoteBtn').hide();
	        	
	        	// 결과 퍼센트 바 비활성화
	        	$('#balance-game-progressbar-container').hide();
	        	
    			// 채팅창 비활성화
    			$('#balance-game-chat-container').hide();
	        	$('#recommend-tests').hide();
	        }
	        
			// 엔터키 지원
			$('#chat-content').on('keypress', function(e) {
			    if (e.which == 13) {
			    	insertBalanceGameComment();
			    }
			});
			
			$('#userNicknameInput').on('keypress', function(e) {
			    if (e.which == 13) {
			    	saveNickname();
			    }
			});
	        
	    });
    	
		// [2] 투표 여부 확인
		function isAlreadyVoted() {
			
		    const votedGames = JSON.parse(localStorage.getItem('moondap_voted_games') || '{}');
		    const voteData = votedGames[gameId];
		    console.log(voteData);
		    
		    // a. localstorage에 밸런스 게임 정보가 없을 때
		    if (!voteData) return false;
		    
		    return true;
		}
		
		function applyVoteResultStyle(side) {
		    if (side === 'left') {
		    	// [카드 스타일]
		        // 선택된 항목
		        $('.option1Content').css('transition', 'transform 0.3s ease');
		        $('.option1Content').css('border', '6px solid #3876f2');
		        
		        // 선택되지 않은 항목
		        $('.option2Content').css('transform', 'scale(0.9)');
		        $('.option2Content').css('opacity', '0.7');
		        
		        // [프로그레스 바 스타일]
		        $('.bg-balance-left').removeClass('bg-unselected');
		        $('.bg-balance-right').addClass('bg-unselected');
		    } else {
		        // [카드 스타일]
		        // 선택된 항목
		        $('.option1Content').css('transition', 'transform 0.3s ease');
		        $('.option2Content').css('border', '6px solid #de66e9');
		        
		        // 선택되지 않은 항목
		        $('.option1Content').css('transform', 'scale(0.9)');
		        $('.option1Content').css('opacity', '0.7');
		        
		     	// [프로그레스 바 스타일]
		        $('.bg-balance-right').removeClass('bg-unselected');
		        $('.bg-balance-left').addClass('bg-unselected');
		    }
	        $('.option1Content').css('pointer-events', 'none');
	        $('.option2Content').css('pointer-events', 'none');
		}
    
		function selectOption(element, side) {
			
		    $.ajax({
		        url: '/balanceGame/vote',
		        type: 'POST',
		        contentType: 'application/json',
		        data: JSON.stringify({ 
		            id: /*[[${balanceGame.id}]]*/ 'default', 
		            side: side 
		        }),
		        success: function(data) {
		            // 1. UI 고정
		            element.classList.add('selected');
		            
					// 2. side에 따라 클래스 부여
				    applyVoteResultStyle(side);
					
		            // 3. 결과 반영 (데이터 받아와서 처리)
		            $('.total-count-text').text(data.totalCount);
		            
					$('.option-bar-left').css('width', data.option1Percent + '%');
		            $('.bg-balance-left').text(data.option1Percent + '% (' + data.option1Count + '명)');
		            
					$('.option-bar-right').css('width', data.option2Percent + '%');
		            $('.bg-balance-right').text(data.option2Percent + '% (' + data.option2Count + '명)');

		            // 4. 로컬 스토리지에 사용자의 밸런스 게임 정보 저장
		            saveVoteLocalStorage(side);
		            
		            // 5. 다시하기 버튼 활성화. 방금 투표했으므로 대기 시간부터 시작한다.
					$('#resetVoteBtn').fadeIn();
					startCooldownCountdown();
		            
					// 6. 결과 퍼센트 바 활성화
	    			$('#balance-game-progressbar-container').show();
					
	    			// 7. 투표 성공 시 채팅창과 결과 바를 부드럽게 보여줌
					$('#recommend-tests').fadeIn(500);
					$('#balance-game-chat-container').fadeIn(500, function() {
					    // 1. 첫 번째 댓글 요소 선택 (renderCommentList가 실행된 후여야 함)
					    const $firstComment = $('.comment-list > div').first();
					
					    if ($firstComment.length > 0) {
					        const scrollPos = $firstComment.offset().top + $firstComment.outerHeight() - $(window).height();
					        $('html, body').animate({
					            scrollTop: scrollPos
					        }, 0);
					    }
					});
	                
				    // 8. 폭죽 효과 실행
				    const rect = element.getBoundingClientRect();
    
				    const centerX = (rect.left + rect.width / 2) / window.innerWidth;
				    const centerY = (rect.top + rect.height / 2) / window.innerHeight;
				    
				    confetti({
		                particleCount: 150,
		                spread: 70,
		                origin: { x: centerX, y: centerY },
		                colors: ['#524FD0', '#ffffff', '#3876f2'],
		                zIndex: 9999
		            });

                    // 9. 댓글 데이터 가져오기
	                selectBalanceGameComment(false);
		        },
		        error: function(xhr, status, error) {
		        	console.log("Status: " + status);
		            console.log("Error: " + error);
		            console.log("ResponseText: " + xhr.responseText);
		            alert("투표 중 오류가 발생했습니다.");
		        }
		    });
		}
		
		// [1] 투표 저장 (LocalStorage 활용)
		function saveVoteLocalStorage(side) {
		    // 1. 기존 데이터 가져오기 (없으면 빈 객체)
		    const votedGames = JSON.parse(localStorage.getItem('moondap_voted_games') || '{}');
		    
		    // 2. 새 데이터 추가
		    votedGames[gameId] = {
		        side: side,
		        time: new Date().getTime()
		    };
		    
		    // 3. 다시 저장
		    localStorage.setItem('moondap_voted_games', JSON.stringify(votedGames));
		}

    	/*
    	 * 다시 선택하기.
    	 *
    	 * 예전에는 대기 시간이 남았을 때 alert("N초 뒤 다시할 수 있습니다.") 를 띄웠다.
    	 * 브라우저 경고창이라 흐름이 끊기는 데다, 버튼을 누르기 전까지는 기다려야
    	 * 한다는 사실 자체를 알 수 없었다. 이제는 버튼이 남은 시간을 직접 보여주고,
    	 * 다 되면 스스로 풀린다. 그래서 이 함수에 도달할 때는 이미 누를 수 있는 상태다.
    	 */
    	function resetVote() {
    		if (remainingCooldownMs() > 0) {
    			return;
    		}

    		const votedGames = JSON.parse(localStorage.getItem('moondap_voted_games') || '{}');
    		delete votedGames[gameId];
    		localStorage.setItem('moondap_voted_games', JSON.stringify(votedGames));

    		location.reload();
    	}

    	/** 다시 선택할 수 있을 때까지 남은 시간(ms). 투표 이력이 없으면 0. */
    	function remainingCooldownMs() {
    		const votedGames = JSON.parse(localStorage.getItem('moondap_voted_games') || '{}');
    		const voteData = votedGames[gameId];
    		if (!voteData || !voteData.time) {
    			return 0;
    		}
    		return Math.max(0, VOTE_COOLDOWN_MS - (Date.now() - voteData.time));
    	}

    	let cooldownTimer = null;

    	/**
    	 * 대기 시간 동안 버튼을 잠그고 남은 초를 보여준다.
    	 * 1초마다 갱신하다가 0 이 되면 스스로 풀린다.
    	 */
    	function startCooldownCountdown() {
    		const $btn = $('#resetVoteBtn');
    		if ($btn.length === 0) {
    			return;
    		}

    		if (cooldownTimer) {
    			clearInterval(cooldownTimer);
    			cooldownTimer = null;
    		}

    		const enable = function() {
    			$btn.prop('disabled', false)
    			    .html('<i class="bi bi-arrow-counterclockwise"></i> 다시 선택');
    		};

    		const tick = function() {
    			const remain = remainingCooldownMs();
    			if (remain <= 0) {
    				enable();
    				if (cooldownTimer) {
    					clearInterval(cooldownTimer);
    					cooldownTimer = null;
    				}
    				return;
    			}
    			// 남은 시간을 올림해야 "1초"에서 곧바로 "0초"로 건너뛰지 않는다.
    			const seconds = Math.ceil(remain / 1000);
    			$btn.prop('disabled', true)
    			    .html('<i class="bi bi-hourglass-split"></i> ' + seconds + '초 후 다시 선택');
    		};

    		tick();
    		if (remainingCooldownMs() > 0) {
    			cooldownTimer = setInterval(tick, 1000);
    		}
    	}
    	
    	// 현재 댓글 정렬과 다음 더보기 위치
    	let commentSort = 'latest';
    	let commentOffset = 0;

    	/**
    	 * 댓글 조회.
    	 *
    	 * 예전에는 한 게임의 댓글을 LIMIT 없이 전부 받아왔다. 댓글이 쌓이면 그만큼
    	 * 한 번에 내려받아야 해서 화면이 무거워졌다. 이제 20개씩 끊어 받는다.
    	 *
    	 * @param append true 면 기존 목록 뒤에 붙인다(더보기). false 면 새로 그린다.
    	 */
    	function selectBalanceGameComment(append) {
    		const offset = append ? commentOffset : 0;

	    	$.ajax({
		        url: '/balanceGame/selectBalanceGameComment',
		        type: 'POST',
		        contentType: 'application/json',
		        data: JSON.stringify({
		            id: /*[[${balanceGame.id}]]*/ 'default',
		            sort: commentSort,
		            offset: offset
		        }),
		        success: function(page) {
		        	if (append) {
		        		appendCommentList(page.comments);
		        	} else {
		        		renderCommentList(page.comments);
		        	}
		        	commentOffset = page.nextOffset;
		        	$('#comment-more-container').toggle(!!page.hasMore);
		        },
		        error: function(xhr, status, error) {
		        	console.log("Status: " + status);
		            console.log("Error: " + error);
		            console.log("ResponseText: " + xhr.responseText);
		            alert("댓글 조회 중 오류가 발생했습니다.");
		        },
		        complete: function() {
		        	$('#commentMoreBtn').prop('disabled', false)
		        	                    .html('댓글 더보기 <i class="bi bi-chevron-down ms-1"></i>');
		        }
		    });
    	}

    	/** 더보기. 연타로 같은 페이지를 두 번 받지 않도록 버튼을 잠근다. */
    	function loadMoreComments() {
    		const $btn = $('#commentMoreBtn');
    		if ($btn.prop('disabled')) {
    			return;
    		}
    		$btn.prop('disabled', true).html('불러오는 중...');
    		selectBalanceGameComment(true);
    	}

    	/** 정렬 전환. 같은 정렬을 다시 눌러도 재조회하지 않는다. */
    	function changeCommentSort(sort) {
    		if (commentSort === sort) {
    			return;
    		}
    		commentSort = sort;
    		$('.comment-sort-link').removeClass('active');
    		$('.comment-sort-link[data-sort="' + sort + '"]').addClass('active');
    		selectBalanceGameComment(false);
    	}
    	
    	// 댓글 삭제 (관리자용)
    	function deleteComment(commentNo) {
    	    if (!confirm("이 댓글을 삭제하시겠습니까?")) return;
    	    
    	    $.ajax({
    	        url: '/balanceGame/deleteBalanceGameComment',
    	        type: 'POST',
    	        contentType: 'application/json',
    	        data: JSON.stringify({ 
    	            no: commentNo
    	        }),
    	        success: function(res) {
    	            if (res.flag === 'success') {
    	                // 전체 재조회 대신 해당 댓글만 제거한다.
    	                const $target = $('.comment-list').find(`[data-comment-no="${commentNo}"]`);
    	                $target.fadeOut(200, function() {
    	                    $(this).remove();
    	                    if ($('.comment-list').children().length === 0) {
    	                        $('.comment-list').append(buildEmptyMessage());
    	                    }
    	                });
    	            } else {
    	                alert(res.message || "삭제 실패했습니다.");
    	            }
    	        },
    	        error: function(xhr) {
    	            const serverMsg = xhr.responseJSON && xhr.responseJSON.message;
    	            alert(serverMsg || "삭제 처리 중 오류가 발생했습니다.");
    	        }
    	    });
    	}
    	
    	// 댓글 달기
		function insertBalanceGameComment() {
			if (isAlreadyVoted()) {
				
				let content = $('#chat-content').val();
				
			    const votedGames = JSON.parse(localStorage.getItem('moondap_voted_games') || '{}');
			    const voteData = votedGames[gameId];
				let voteSide = voteData.side;
				
	            // 1. 유효성 검사 (50자 이내 입력 가능)
		        if (!content || content.trim() === "") {
		            alert("메시지를 입력해주세요.");
		            return;
		        }
		        if (content.length > 50) {
		            alert("50자 이내로 입력 가능합니다.");
		            return;
		        }
	    			
		        // 2. nickname - session에 저장되어있는지 확인
		        if (isNicknameSet()) {
		            // 3. 서버로 요청
				    $.ajax({
				        url: '/balanceGame/insertBalanceGameComment',
				        type: 'POST',
				        contentType: 'application/json',
				        // side 는 보내지 않는다. 서버가 투표 기록에서 결정한다.
				        // (예전에는 localStorage 값을 그대로 보내서 투표하지 않은 진영으로도 댓글이 달렸다)
				        data: JSON.stringify({ 
				            id: /*[[${balanceGame.id}]]*/ 'default', 
				            nickname: nickname,
				            side: voteSide,
				            content: content
				        }),
				        success: function(comment) {
				        	if (!comment) {
					            alert("댓글 입력 중 오류가 발생했습니다.");
					            return;
				        	}

				        	// 전체를 다시 그리지 않고 방금 쓴 댓글만 맨 앞에 붙인다.
				        	prependComment(comment);

				        	$('#chat-content').val('');
				            $('#chat-content').focus();
				        },
				        error: function(xhr, status, error) {
				        	console.log("Status: " + status);
				            console.log("Error: " + error);
				            console.log("ResponseText: " + xhr.responseText);
				            const serverMsg = xhr.responseJSON && xhr.responseJSON.message;
				            alert(serverMsg || "댓글 입력 중 오류가 발생했습니다.");
				        }
				    });
		        } else {
		            // 닉네임이 없는 경우 -> 팝업(모달) 띄우기
		            const nicknameModal = new bootstrap.Modal(document.getElementById('nicknameModal'));
		            nicknameModal.show();
		            $('#nicknameModal').on('shown.bs.modal', function () {
		                $('#userNicknameInput').trigger('focus');
		            });
		        }
		        
			} else {
				alert("선택 후 댓글을 달 수 있습니다.");
			}
		}
		
    	// nickname 체크 함수
		function isNicknameSet() {
		    if (!isAnonymous) {
		        nickname = currentUserId;
		        return true;
		    }
		    nickname = localStorage.getItem('moondap_comment_nickname');
		    return (nickname !== null && nickname.trim() !== "");
		}
    	
    	// nickname 저장 함수
    	function saveNickname() {
		    const nicknameInput = $('#userNicknameInput').val().trim();
		    
		    if (nicknameInput === "") {
		        alert("닉네임을 입력해 주세요!");
		        return;
		    }
		    
		    if (nicknameInput.length >= 8) {		    	
		        alert("닉네임을 8자 이내로 설정해 주세요.");
		        return;
		    }
		
		    // 로컬 스토리지에 저장
		    localStorage.setItem('moondap_comment_nickname', nicknameInput);
		    
		    // 모달 닫기
		    const nicknameModal = bootstrap.Modal.getInstance(document.getElementById('nicknameModal'));
		    nicknameModal.hide();
		    
		    // 댓글 추가
		    insertBalanceGameComment();
		}
    	
    	// nickname 팝업창 취소 버튼 시
    	function cancelNickname() {
    	    $('#userNicknameInput').val('');
    	    
    	    const nicknameModalEl = document.getElementById('nicknameModal');
    	    const modalInstance = bootstrap.Modal.getInstance(nicknameModalEl);
    	    
    	    if (modalInstance) {
    	        modalInstance.hide();
    	    }
    	    
    	    $('#chat-content').focus();
    	}
    	
    	// HTML 이스케이프 함수 (XSS 방지)
    	// escapeHtml 은 /assets/js/html-escape.js 에서 전역으로 제공된다.
    	// 화면마다 복사해 두면 어떤 화면에서 빠져도 알 수 없기 때문에 한 곳으로 모았다.
    	// (실제로 selectBalanceGameList.html 에는 이 함수가 없어 제목이 그대로 삽입됐다)
    	
    	// 댓글 그리기
		function renderCommentList(commentList) {
		    const $commentContainer = $('.comment-list');
		    $commentContainer.empty();

		    if (!commentList || commentList.length === 0) {
		        $commentContainer.append(buildEmptyMessage());
		        return;
		    }

		    commentList.forEach(comment => {
		        $commentContainer.append(buildCommentHtml(comment));
		    });

		    if (typeof AOS !== 'undefined') {
		        AOS.refresh();
		    }
		}

		/** 더보기로 받은 댓글을 기존 목록 뒤에 붙인다. */
		function appendCommentList(commentList) {
		    if (!commentList || commentList.length === 0) {
		        return;
		    }
		    const $container = $('.comment-list');
		    $container.find('.comment-empty-message').remove();
		    commentList.forEach(comment => {
		        $container.append(buildCommentHtml(comment));
		    });

		    if (typeof AOS !== 'undefined') {
		        AOS.refresh();
		    }
		}

		/**
		 * 댓글 하나만 갱신한다.
		 *
		 * 예전에는 좋아요 하나를 눌러도 전체 목록을 다시 받아 DOM 을 통째로 교체했다.
		 * 그때마다 입력 중이던 댓글과 스크롤 위치가 사라졌다.
		 */
		function replaceComment(comment) {
		    if (!comment) return;
		    const $existing = $('.comment-list').find(`[data-comment-no="${comment.no}"]`);
		    if ($existing.length) {
		        $existing.replaceWith(buildCommentHtml(comment));
		    }
		}

		/**
		 * 새 댓글을 목록 맨 앞에 붙인다.
		 *
		 * 인기순으로 보고 있어도 맨 앞에 둔다. 방금 자기가 쓴 글이 보이지 않으면
		 * 등록이 안 된 줄 알기 때문이다.
		 *
		 * commentOffset 을 함께 올려야 한다. 서버 쪽 목록이 한 건 늘었으므로
		 * 그대로 두면 다음 더보기에서 한 건을 건너뛴다.
		 */
		function prependComment(comment) {
		    if (!comment) return;
		    const $container = $('.comment-list');
		    $container.find('.comment-empty-message').remove();
		    $container.prepend(buildCommentHtml(comment));
		    commentOffset += 1;
		}

		function buildEmptyMessage() {
		    const votedGames = JSON.parse(localStorage.getItem('moondap_voted_games') || '{}');
		    const side = votedGames[gameId] ? votedGames[gameId].side : 'left';

		    return `
		        <div class="comment-empty-message d-flex flex-column ${side === 'left' ? 'align-items-start' : 'align-items-end'} mb-3" data-aos="fade-up">
		            <div class="p-3"
		                style="background: ${side === 'left' ? '#1e213a' : '#251b3a'};
		                       border: 1px solid ${side === 'left' ? '#3876f2' : '#de66e9'};
		                       border-radius: ${side === 'left' ? '2px 15px 15px 15px' : '15px 2px 15px 15px'};
		                       max-width: 80%; text-align: left;">
		                <p class="mb-0" style="color: #e9ecef; font-size: 0.95rem;">첫 번째 댓글을 남겨보세요!</p>
		            </div>
		        </div>`;
		}

		/**
		 * 댓글 하나의 HTML 을 만든다.
		 *
		 * likedByMe / deletable 은 서버가 요청자 기준으로 계산해 내려준 값이다.
		 * 예전에는 localStorage 로 판단해서 기기를 바꾸면 하트가 풀렸고,
		 * 삭제 버튼은 관리자에게만 보였다.
		 */
		function buildCommentHtml(comment) {
		    const safeNickname = escapeHtml(comment.nickname);
		    const safeContent = escapeHtml(comment.content);
		    const heartClass = comment.likedByMe ? 'bi-heart-fill text-danger' : 'bi-heart text-secondary';
		    const countColor = comment.likedByMe ? '#ef4444' : '#6c757d';
		    const likeCount = Number(comment.likeCount) || 0;

		    // 로그인한 사용자의 경우 체크 표시 추가
		    const checkmark = comment.userId ? '<i class="bi bi-patch-check-fill user-verified-check" title="인증된 사용자"></i>' : '';

		    const deleteBtn = comment.deletable
		        ? `<i class="bi bi-x-circle-fill admin-delete-btn" onclick="deleteComment(${comment.no})" title="댓글 삭제"></i>`
		        : '';

		    const likeBlock = `
		        <div class="d-flex align-items-center gap-1 like-wrapper" style="cursor: pointer; min-width: 20px; line-height: 1;">
		            <i class="bi ${heartClass} fs-6 like-icon" onclick="toggleLike(this, ${comment.no})"></i>
		            <span class="like-count" style="font-size: 0.75rem; color: ${countColor};" onclick="toggleLike(this, ${comment.no})">${likeCount}</span>
		            ${deleteBtn}
		        </div>`;

		    if (comment.selectedSide === 'left') {
		        return `
		            <div class="d-flex flex-column mb-1" data-comment-no="${comment.no}">
		                <div class="d-flex flex-row align-items-center">
		                    <div class="d-flex flex-column flex-grow-1">
		                        <div class="d-flex align-items-center mb-1 ms-1">
		                            <span style="color: #3876f2; font-weight: bold; font-size: 0.8rem;">${safeNickname}${checkmark}</span>
		                        </div>
		                        <div class="d-flex align-items-center">
		                            <div class="comment-bubble-left">
		                                <p class="mb-0" style="color: #e9ecef; font-size: 0.95rem; white-space: pre-wrap;">${safeContent}</p>
		                            </div>
		                            <div class="ms-2">${likeBlock}</div>
		                        </div>
		                        <small class="mt-1 ms-1" style="color: #6c757d; font-size: 0.7rem;">${timeSince(comment.createdAt)}</small>
		                    </div>
		                </div>
		            </div>`;
		    }

		    return `
		        <div class="d-flex flex-column mb-1" data-comment-no="${comment.no}">
		            <div class="d-flex flex-column" style="max-width: 100%;">
		                <div class="d-flex flex-column flex-grow-1">
		                    <div class="d-flex align-items-center justify-content-end mb-1 me-1">
		                        <span style="color: #de66e9; font-weight: bold; font-size: 0.8rem;">${safeNickname}${checkmark}</span>
		                    </div>
		                    <div class="d-flex align-items-center justify-content-end">
		                        <div class="me-2">${likeBlock}</div>
		                        <div class="comment-bubble-right">
		                            <p class="mb-0" style="color: #e9ecef; font-size: 0.95rem; white-space: pre-wrap;">${safeContent}</p>
		                        </div>
		                    </div>
		                    <small class="mt-1 me-1 text-end" style="color: #6c757d; font-size: 0.7rem;">${timeSince(comment.createdAt)}</small>
		                </div>
		            </div>
		        </div>`;
		}

		/**
		 * 좋아요 토글
		 *
		 * 누를지 취소할지는 서버의 기록이 결정한다.
		 * 예전에는 화면이 localStorage 를 보고 'UP'/'DOWN' 을 정해 보냈기 때문에,
		 * 저장소를 지우면 같은 댓글에 좋아요를 무한히 올릴 수 있었다.
		 */
		function toggleLike(element, commentNo) {
			if (!isAlreadyVoted()) {
				alert("선택 후 좋아요를 누를 수 있습니다.");
				return;
			}

			const targetNo = Number(commentNo);

			// 연타 방지
			if (processingLikeComments[targetNo]) return;
			processingLikeComments[targetNo] = true;

			$.ajax({
				url: '/balanceGame/updateBalanceGameCommentLikeCount',
				type: 'POST',
				contentType: 'application/json',
				data: JSON.stringify({
					no: targetNo,
					id: gameId
				}),
				success: function(comment) {
					// 바뀐 댓글 하나만 교체한다.
					replaceComment(comment);
				},
				error: function(xhr) {
					const serverMsg = xhr.responseJSON && xhr.responseJSON.message;
					alert(serverMsg || "좋아요 처리 중 오류가 발생했습니다.");
				},
				complete: function() {
					delete processingLikeComments[targetNo];
				}
			});
		}


		/**
		 * 시간을 '방금 전', 'n분 전' 형태로 변환하는 유틸 함수
		 */
		function timeSince(date) {
		    const seconds = Math.floor((new Date() - new Date(date)) / 1000);
		    let interval = seconds / 31536000;

		    if (interval > 1) return Math.floor(interval) + "년 전";
		    interval = seconds / 2592000;
		    if (interval > 1) return Math.floor(interval) + "달 전";
		    interval = seconds / 86400;
		    if (interval > 1) return Math.floor(interval) + "일 전";
		    interval = seconds / 3600;
		    if (interval > 1) return Math.floor(interval) + "시간 전";
		    interval = seconds / 60;
		    if (interval > 1) return Math.floor(interval) + "분 전";
		    return "방금 전";
		}
    	
		function goToNextOrPrevGame(direction) {
			
			// 세션에 저장되어있는 검색 조건
	    	let listCategory = localStorage.getItem('moondap_balancegame_category');
	    	let listSpicyFilter = localStorage.getItem('moondap_balancegame_spicyfilter');
	    	
	    	// null 체크 및 기본값 설정
	    	if (!listCategory || listCategory === 'null') listCategory = 'all';
	    	if (!listSpicyFilter || listSpicyFilter === 'null') listSpicyFilter = '1';
	    	
		    $.ajax({
		        url: '/balanceGame/nextOrPrevBalanceGameIdSelect',
		        type: 'POST',
		        contentType: 'application/json',
		        data: JSON.stringify({ 
		            id: /*[[${balanceGame.id}]]*/ 'default',
		            direction: direction,
		            spicyFilter: listSpicyFilter,
		            category: listCategory
		        }),
		        success: function(gameId) {
		            if (gameId) {
		                location.href = '/balanceGame/selectBalanceGameView?id=' + gameId + '&spicyFilter=' + listSpicyFilter + '&category=' + listCategory;
		            }
		        },
		        error: function() {
		            alert("질문을 가져오는 데 실패했습니다.");
		        }
		    });
		}
		
		function testComment() {
			if (isAlreadyVoted()) {
			    const $balanceGameChatContainer = $('#balance-game-chat-container');
			    const $btn = $('.comment-view-hide-text');
	
			    $balanceGameChatContainer.slideToggle(300, function() {
			        if ($balanceGameChatContainer.is(':visible')) {
			            $btn.html('댓글 숨기기 <i class="bi bi-chevron-up"></i>');
			        } else {
			            $btn.html('댓글 보기 <i class="bi bi-chevron-down"></i>');
			        }
			    });
			} else {
				alert("투표 진행 후 댓글을 볼 수 있습니다.");
			}
		}
		
		function updateBalanceGameView() {
			location.href = '/balanceGame/updateBalanceGameView?id=' + gameId;
		}
		
		function balanceGameListView() {
			location.href = '/balanceGame/selectBalanceGameListView';
		}
		
		function shareKakao() {
		  const shareUrl = window.location.origin + '/balanceGame/select?userNo=' + /*[[${balanceGame.id}]]*/ 'default';
		  const title = /*[[${balanceGame.title}]]*/ 'title';
		  const description = '어떤 선택을 했을까요? 지금 바로 확인해 보세요!';

		  shareKakaoCommon({
		    title: title,
		    description: description,
		    imageUrl: window.location.origin + '/assets/img/logo.webp',
		    shareUrl: shareUrl,
		    buttonTitle: '결과 보러가기'
		  });
		}
		
		function copyLink() {
		    copyLinkCommon(null, function() {
		        const toast = document.getElementById("copyToast");
		        toast.className = "show";
		        setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
		    });
		}
    </script>
</head>

<body layout:fragment="content">
    <!-- 복사 알림 토스트 -->
    <div id="copyToast"><i class="bi bi-check-circle-fill me-2"></i>링크가 복사되었습니다!</div>
    
    <div class="container">

		<!-- Balance Game Section -->
		<section id="team" class="team section py-1 z-1">
			<div class="container px-0" data-aos="fade-up" data-aos-delay="100">

				<div class="row">
					<div class="col-12">
						<div class="team-carousel-wrapper" data-aos="fade-up"
							data-aos-delay="100">
							<div class="mt-3">
								<h4 class="carousel-title mb-0 p-2" th:text="${balanceGame.title}"></h4>
							</div>
							
							<!-- Share Section -->
							<section id="share-container" class="py-1 my-1 position-relative z-2 overflow-visible">
								<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
									<div>
									<button type="button"
										class="btn btn-outline-light"
										onclick="balanceGameListView()" >
										<i class="bi bi-list-task"></i> 리스트로 이동
									</button>
									<button type="button"
										class="btn btn-outline-light"
										onclick="updateBalanceGameView()" 
										th:if="${(!isAnonymous and currentUserId == balanceGame.userId) or #authorization.expression('hasRole(''ADMIN'')')}">
										<i class="bi bi-pencil-fill"></i> 편집하기
									</button>
									</div>
									<div class="btn-group dropdown">
										<button type="button"
											class="btn btn-outline-light dropdown-toggle"
											data-bs-toggle="dropdown" aria-expanded="false">
											<i class="bi bi-share-fill"></i>
										</button>
										<ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark text-nowrap">
											<li>
												<div class="form-check form-switch custom-switch d-flex justify-content-between align-items-center px-2"
													onclick="shareKakao('testUser')"
													style="min-height: 32px;">
													<label class="form-check-label text-white small mb-0"

														<i class="bi bi-chat-fill"></i> 카카오톡 공유</label>
												</div>
											</li>
											<li>
												<div class="form-check form-switch custom-switch d-flex justify-content-between align-items-center px-2"
													onclick="copyLink()"
													style="min-height: 32px; cursor: pointer;">
													<label class="form-check-label text-white small mb-0"

														<i class="bi bi-clipboard-fill"></i> 링크 복사</label>
												</div>
											</li>
										</ul>
									</div>
								</div>
							</section>
							
							<div class="row leadership-slider py-0">
								
								<div class="col-6 pe-1">
								    <div class="leader-card selection-card option1Content" onclick="selectOption(this, 'left')">
								        <div class="leader-image">
											<img th:src="@{'/uploads/' + ${balanceGame.option1ImagePath}}" alt="선택지1">
								            <div class="overlay"></div> 
								        </div>
								        <div class="leader-info">
								            <h5 th:text="${balanceGame.option1Text}">선택지 1</h5>
								        </div>
								    </div>
								</div>
								
								<div class="col-6 ps-1">
								    <div class="leader-card selection-card option2Content" onclick="selectOption(this, 'right')">
								        <div class="leader-image">
											<img th:src="@{'/uploads/' + ${balanceGame.option2ImagePath}}" alt="선택지2">
								            <div class="overlay"></div> 
								        </div>
								        <div class="leader-info">
								            <h5 th:text="${balanceGame.option2Text}">선택지 2</h5>
								        </div>
								    </div>
								</div>

							</div>
						</div>
					</div>
				</div>

			</div>

		</section>
		<!-- /Balance Game Section -->

		<!-- Share Section -->
		<section id="share-container" class="py-1 my-1 position-relative z-2 overflow-visible">
			<div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
				<button type="button"
					class="btn btn-outline-light"
					onclick="goToNextOrPrevGame('PREV')">
					<i class="bi bi-arrow-left-circle-fill"></i> 이전 질문
				</button>

				<!--
				  아이콘만 있어서 무슨 버튼인지 알 수 없었다. 글자를 함께 보여준다.
				  대기 중에는 disabled 가 되고 남은 초가 여기에 표시된다
				  (startCooldownCountdown).
				-->
				<button type="button"
					class="btn btn-outline-light" id="resetVoteBtn"
					onclick="resetVote()">
					<i class="bi bi-arrow-counterclockwise"></i> 다시 선택
				</button>
				<button type="button"
					class="btn btn-outline-light"
					onclick="goToNextOrPrevGame('NEXT')">
					다음 질문 <i class="bi bi-arrow-right-circle-fill"></i>
				</button>
			</div>
		</section>
		<!-- /Share Section -->
		
		<!-- progress bar Section -->
		<section id="balance-game-progressbar-container" class="py-2 my-2">
			<div class="progress-stacked bord-radius-20" style="height: 35px;">
				<div class="progress option-bar-left" role="progressbar"
					th:style="'width: ' + ${balanceGame.option1Percent} + '%; height: 35px;'">
					<div class="progress-bar bg-unselected bg-balance-left">[[${balanceGame.option1Percent}]]% ([[${balanceGame.option1Count}]]명)</div>
				</div>
				<div class="progress option-bar-right" role="progressbar"
					th:style="'width: ' + ${balanceGame.option2Percent} + '%; height: 35px;'">
					<div class="progress-bar bg-unselected bg-balance-right">[[${balanceGame.option2Percent}]]% ([[${balanceGame.option2Count}]]명)</div>
				</div>
			</div>
		</section>
		<!-- /progress bar Section -->
		
		<!-- Chat Section -->
		<section id="balance-game-chat-container" class="py-1 mb-3">
				
			<!-- 댓글 창 -->
			<section class="chat-input-container pt-0 pb-3">
				<div class="chat-input-wrapper p-2">
					<div class="d-flex align-items-center">
	
						<button type="button" class="btn btn-muted btn-icon btn-sm ms-2">
							<i class="bi bi-chat-dots-fill"></i>
						</button>
	
						<input type="text"
							id="chat-content"
							class="form-control border-0 bg-transparent text-white shadow-none px-3"
							placeholder="댓글 추가" style="font-size: 0.95rem;">
	
						<button type="button"
							onclick="insertBalanceGameComment()"
							class="btn btn-primary btn-icon btn-circle">
							<i class="bi bi-send-fill"></i>
						</button>
					</div>
				</div>
			</section>
			
			<!--
			  정렬 선택.
			  좋아요 기능이 있는데 정렬에 쓰이지 않아서, 좋아요를 아무리 받아도
			  재밌는 댓글이 최신 댓글 아래로 계속 밀렸다.
			-->
			<div class="comment-sort">
				<button type="button" class="comment-sort-link active"
						data-sort="latest" onclick="changeCommentSort('latest')">최신순</button>
				<button type="button" class="comment-sort-link"
						data-sort="popular" onclick="changeCommentSort('popular')">인기순</button>
			</div>

			<!-- 댓글을 보여줄 영역 -->
			<div class="comment-list"></div>

			<!-- 더보기. 남은 댓글이 있을 때만 보인다. -->
			<div class="text-center mt-3" id="comment-more-container" style="display: none;">
				<button type="button" class="btn btn-outline-light btn-sm" id="commentMoreBtn"
						onclick="loadMoreComments()">
					댓글 더보기 <i class="bi bi-chevron-down ms-1"></i>
				</button>
			</div>
		</section>
		<!-- /Chat Section -->

		<!--
		  추천 테스트 섹션

		  투표 직후가 관여도가 가장 높은 순간인데, 이 화면에서 나갈 길이
		  '이전/다음 질문'과 '리스트로 이동' 뿐이라 밸런스 게임 안에서만 돌게 됐다.
		  테스트 결과·에겐테토 화면에는 이미 있던 패턴을 여기에도 둔다.

		  밸런스 게임은 일부러 추천하지 않는다. '다음 질문' 버튼이 그 역할을 한다.

		  [레이아웃] 다른 화면의 큰 세로 카드 대신 가로형으로 만든다.
		  여기는 댓글을 모두 지나온 뒤에 나오는 위치라, 세로 카드 3개를 쓰면
		  모바일에서 2천 픽셀이 넘어 끝까지 보지 않는다. 썸네일이 없는 콘텐츠가
		  거대한 빈 박스로 보이는 문제도 함께 없앤다.
		-->
		<section id="recommend-tests" class="py-4" style="display: none;"
				 th:if="${popularNormalTests != null and !#lists.isEmpty(popularNormalTests)}">
			<div class="text-center mb-3">
				<h5 class="fw-bold text-white mb-1">
					<i class="bi bi-journal-check me-2 style-color-primary"></i>이런 테스트는 어때요?
				</h5>
				<p class="text-white-50 small mb-0">선택은 끝났으니, 이번엔 나를 알아볼 차례예요</p>
			</div>

			<div class="rec-list">
				<a th:each="t : ${popularNormalTests}"
				   th:href="${t.type == 'EGEN'}
							? @{/egenTeto/selectEgenTetoGame}
							: @{/test/{key}(key=${t.key})}"
				   class="rec-item">
					<div class="rec-thumb">
						<img th:if="${t.thumbnail != null and t.thumbnail != ''}"
							 th:src="${#strings.startsWith(t.thumbnail, '/assets/')}
									 ? ${t.thumbnail}
									 : (@{/uploads/} + ${t.thumbnail})"
							 th:alt="${t.title}" loading="lazy">
						<!-- 썸네일이 없으면 빈 박스 대신 아이콘을 둔다 -->
						<span th:unless="${t.thumbnail != null and t.thumbnail != ''}" class="rec-thumb-fallback">
							<i class="bi bi-journal-text"></i>
						</span>
						<span th:if="${t.isNew}" class="rec-new">NEW</span>
					</div>

					<div class="rec-body">
						<div class="rec-meta">
							<span class="rec-cat" th:text="${t.categoryName}">카테고리</span>
							<span class="rec-play">
								<i class="bi bi-eye-fill"></i>
								<span th:text="${#numbers.formatInteger(t.playCount, 0, 'COMMA')}">0</span>
							</span>
						</div>
						<div class="rec-title" th:text="${t.title}">테스트 제목</div>
						<div class="rec-desc" th:text="${t.description}">설명</div>
					</div>

					<i class="bi bi-chevron-right rec-arrow"></i>
				</a>
			</div>

			<div class="text-center mt-3">
				<a href="/test/list?type=NORMAL" class="btn btn-primary btn-sm px-4">
					테스트 전체보기 <i class="bi bi-arrow-right ms-1"></i>
				</a>
			</div>
		</section>
	</div>

	<div class="modal fade" id="nicknameModal" tabindex="-1"
		aria-labelledby="nicknameModalLabel" aria-hidden="true"
		data-bs-backdrop="static" data-bs-keyboard="false">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content moondap-modal-content">
				<div class="modal-header border-0">
					<h5 class="modal-title w-100 text-center" id="nicknameModalLabel">댓글 닉네임을 설정합니다.</h5>
				</div>
				<div class="modal-body py-0">
					<div class="chat-input-wrapper p-2">
						<div class="d-flex align-items-center">
							<button type="button" class="btn btn-muted btn-icon btn-sm ms-2">
								<i class="bi bi-person-circle"></i>
							</button>
							<input type="text"
								id="userNicknameInput"
								class="form-control border-0 bg-transparent text-white shadow-none px-3"
								placeholder="닉네임을 입력하세요 (최대 8자)" style="font-size: 0.95rem;" maxlength="8">
						</div>
					</div>
				</div>
				<div class="modal-footer border-0 justify-content-center gap-2">
				    <button type="button" class="btn btn-outline-light"
				        onclick="cancelNickname()">취소</button>
				    <button type="button" class="btn btn-primary"
				        onclick="saveNickname()">등록</button>
				</div>
			</div>
		</div>
	</div>

</body>
</html>
