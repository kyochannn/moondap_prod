<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{/layout/main_layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${test.title} + ' - 질문 진행 중'">테스트 진행 중</title>
    <link th:href="@{/assets/css/question-page.css}" rel="stylesheet">
    <link th:href="@{/assets/css/analysis-handler.css}" rel="stylesheet">
    <script th:src="@{/assets/js/test-progress.js(v=1.0)}"></script>
</head>

<body layout:fragment="content">
    <style>
        #previewToast {
            visibility: hidden; min-width: 250px; background-color: #ffc107; color: #000;
            text-align: center; border-radius: 10px; padding: 12px 24px; position: fixed;
            z-index: 10000; bottom: 50px; left: 50%; transform: translateX(-50%);
            font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #previewToast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 50px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 50px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>

    <div id="previewToast">
        <i class="bi bi-eye-fill me-2"></i>관리자 미리보기 모드입니다.
    </div>

    <main class="main">
        <div class="wizard-container" data-aos="fade-up">
            <!-- 프로그레스 바 -->
            <div class="test-progress">
                <div id="progressBar" class="test-progress-bar"></div>
            </div>

            <!-- 질문 노출 영역 -->
            <div id="questionContainer">
                <div class="waiting-inline">
                    <div class="spinner-container">
                        <div class="custom-spinner"></div>
                        <div class="spinner-core"></div>
                    </div>
                    <p class="mb-0">질문을 준비하고 있습니다...</p>
                </div>
            </div>

            <!-- 하단 네비게이션 -->
            <div class="mt-4 d-flex justify-content-between align-items-center">
                <button id="prevBtn" class="btn btn-outline-light" style="display:none;">
                    <i class="bi bi-arrow-left"></i> 이전
                </button>
                <div id="questionNumber" class="text-secondary fw-bold">1 / 1</div>
            </div>
        </div>

        <!-- 결과 전송 폼 (미리보기 상태 유지) -->
        <form id="submitForm" th:action="@{/test/{key}/result(key=${test.testKey}, preview=${isPreview})}" method="post">
            <input type="hidden" id="answersInput" name="answers">
        </form>

        <!-- 분석 대기 모달 -->
        <div id="analysisModal" class="analysis-modal-overlay">
            <div class="analysis-modal-content">
                <div class="mb-3">
                    <span class="badge rounded-pill bg-primary px-3 py-2 mb-3">당신의 결과는?</span>
                    <!-- 카운트다운 중에도 "완료되었습니다"라고 띄워 두면 아래 버튼의
                         "분석 중 (14초)"와 정면으로 모순된다. 두 상태 모두에서 참인 문구로 둔다. -->
                    <h4 class="fw-bold">결과가 준비되었습니다</h4>
                    <p id="statusText" class="text-secondary small mb-4">잠시 후 결과가 열립니다</p>
                </div>

                <button id="finalSubmitBtn" class="btn btn-primary btn-lg w-100" disabled>
                    결과 확인하기 (7초)
                </button>
            </div>
        </div>
    </main>

    <script src="/assets/js/analysis-handler.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.onload = function() {
            const isPreview = /*[[${isPreview}]]*/ false;
            if (isPreview) {
                const previewToast = document.getElementById("previewToast");
                previewToast.style.visibility = "visible";
                previewToast.style.animation = "fadein 0.5s, fadeout 0.5s 2.5s";
                setTimeout(() => { previewToast.style.visibility = "hidden"; }, 3000);
            }
        };

        // 뒤로가기 시 로딩 오버레이 숨기기 처리
        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                if (typeof hideLoading === 'function') {
                    hideLoading();
                }
            }
        });

        // 서버에서 전달받은 질문 리스트 (Thymeleaf 리스트를 JS 객체로 변환)
        const questionsRaw = /*[[${test.questions}]]*/ [];
        const options = ["매우 그렇다", "그렇다", "보통이다", "그렇지 않다", "매우 그렇지 않다"];
        const optionScores = { "매우 그렇다": 5, "그렇다": 4, "보통이다": 3, "그렇지 않다": 2, "매우 그렇지 않다": 1 };
        
        let currentIndex = 0;
        let userAnswers = []; // 각 질문의 실제 점수(1~5)가 담길 예정

        // ── 이어하기 ──────────────────────────────────────────────
        // 미리보기 모드는 실제 응시가 아니므로 저장하지 않는다.
        const PROGRESS_ID = /*[[${test.testKey}]]*/ '';
        const PROGRESS_URL = /*[[@{/test/{key}/questions(key=${test.testKey})}]]*/ '';
        const PROGRESS_TITLE = /*[[${test.title}]]*/ '';
        const canSaveProgress = !(/*[[${isPreview}]]*/ false);

        function saveProgress() {
            if (!canSaveProgress || !window.TestProgress) return;
            TestProgress.save({
                id: PROGRESS_ID, url: PROGRESS_URL, title: PROGRESS_TITLE,
                index: currentIndex, total: questionsRaw.length, answers: userAnswers,
            });
        }

        // 다 풀고 결과 대기 화면(광고 포함)에 머무는 동안의 저장.
        // 광고는 현재 탭에서 열리므로 이 화면은 언제든 사라질 수 있다.
        function savePendingProgress() {
            if (!canSaveProgress || !window.TestProgress) return;
            TestProgress.savePending({
                id: PROGRESS_ID, url: PROGRESS_URL, title: PROGRESS_TITLE,
                total: questionsRaw.length, answers: userAnswers,
            });
        }

        function clearProgress() {
            if (window.TestProgress) TestProgress.clear(PROGRESS_ID);
        }

        /** @return {'pending'|'partial'|false} 복원한 상태 */
        function restoreProgress() {
            if (!canSaveProgress || !window.TestProgress) return false;
            const saved = TestProgress.load(PROGRESS_ID);
            // 문항이 바뀌었을 수 있으므로 개수가 다르면 버린다.
            if (!saved || saved.total !== questionsRaw.length) return false;
            const answers = Array.isArray(saved.answers) ? saved.answers.slice() : [];

            if (saved.pending) {
                // 결과 대기 기록은 답변이 하나라도 비면 서버 계산이 깨진다.
                // 문항만 교체된 경우 개수는 같고 내용이 빌 수 있어 값까지 확인한다.
                const filled = answers.length === questionsRaw.length
                    && answers.every((v) => typeof v === 'number' && !isNaN(v));
                if (!filled) {
                    clearProgress();
                    return false;
                }
                currentIndex = questionsRaw.length;
                userAnswers = answers;
                return 'pending';
            }

            currentIndex = saved.index;
            userAnswers = answers;
            return 'partial';
        }

        const container = document.getElementById("questionContainer");
        const progressBar = document.getElementById("progressBar");
        const qNumberSpan = document.getElementById("questionNumber");
        const prevBtn = document.getElementById("prevBtn");

        function renderQuestion(index) {
            const q = questionsRaw[index];
            container.innerHTML = `
                <div class="question-item active">
                    <h4 class="question-title">Q${index + 1}. ${q.questionText}</h4>
                    <div class="options-list">
                        ${options.map((opt) => `
                            <div class="option-btn" onclick="selectOption(this, ${index}, '${opt}')">
                                <i class="bi bi-circle"></i>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            // UI 상태 업데이트
            const progress = (index / questionsRaw.length) * 100;
            progressBar.style.width = `${progress}%`;
            qNumberSpan.innerText = `${index + 1} / ${questionsRaw.length}`;
            prevBtn.style.display = index > 0 ? 'block' : 'none';
        }

        window.selectOption = function(element, qIdx, optLabel) {
            // 점수 저장 (서버로 보낼 1~4점)
            userAnswers[qIdx] = optionScores[optLabel];
            
            // 시각적 피드백
            const optionsList = element.closest('.options-list');
            optionsList.classList.add('disabled');
            element.classList.add('selected');
            const icon = element.querySelector('i');
            if (icon) {
                icon.classList.remove('bi-circle');
                icon.classList.add('bi-check-circle-fill');
            }

            // 클릭 시 프로그레스 바 채우기
            const nextProgress = ((qIdx + 1) / questionsRaw.length) * 100;
            progressBar.style.width = `${nextProgress}%`;
            
            setTimeout(() => {
                if (qIdx < questionsRaw.length - 1) {
                    currentIndex++;
                    renderQuestion(currentIndex);
                    saveProgress();
                } else {
                    finishTest();
                }
            }, 350);
        };

        // 이어서 시작했다는 사실과 "처음부터" 선택지를 함께 보여준다.
        function showResumeNotice() {
            const notice = document.createElement('div');
            notice.className = 'resume-notice';
            notice.innerHTML =
                '<span><i class="bi bi-clock-history"></i> 저장된 답변부터 이어서 진행합니다.</span>' +
                '<button type="button" class="btn btn-muted btn-sm">처음부터</button>';
            notice.querySelector('button').addEventListener('click', function () {
                clearProgress();
                currentIndex = 0;
                userAnswers = [];
                renderQuestion(0);
                notice.remove();
            });
            container.parentNode.insertBefore(notice, container);
        }

        function finishTest(restored) {
            // 예전에는 여기서 기록을 지웠다. 하지만 아래 대기 화면에는 광고가 있고
            // 현재 탭에서 열리므로, 지우고 나면 광고를 눌렀다 돌아온 사람은 다 푼
            // 답변을 잃고 처음부터 다시 풀어야 했다. 결과 화면이 열릴 때 지운다.
            savePendingProgress();

            // 답변 데이터를 JSON으로 변환하여 저장
            document.getElementById("answersInput").value = JSON.stringify(userAnswers);
            
            // 공통 분석 핸들러 호출 (차단 대비 폴백 추가)
            if (typeof AnalysisHandler !== 'undefined') {
                AnalysisHandler.init({
                    formId: 'submitForm',
                    countdown: 7,
                    verifyUrl: '/test/verify-analysis',
                    // 복원된 사람은 이미 광고를 보고 7초를 기다린 뒤 떠났다.
                    // 같은 대기를 또 시키면 결과를 코앞에 두고 다시 나간다.
                    startUnlocked: !!restored,
                });
            } else {
                console.warn("AnalysisHandler가 차단되었습니다. 즉시 제출합니다.");
                document.getElementById('submitForm').submit();
            }
        }

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
                saveProgress();
            }
        };

        // 초기 시작
        if (questionsRaw.length > 0) {
            const resumed = restoreProgress();
            if (resumed === 'pending') {
                // 다 푼 채로 돌아왔다. 문항을 다시 보여줄 이유가 없으니 대기 화면부터 연다.
                // 모달이 차단돼도 빈 화면이 남지 않도록 마지막 문항은 그려 둔다.
                renderQuestion(questionsRaw.length - 1);
                progressBar.style.width = '100%';
                finishTest(true);
            } else {
                renderQuestion(currentIndex);
                // 말없이 중간부터 시작하면 사용자가 당황하므로 알리고 되돌릴 길을 준다.
                if (resumed) showResumeNotice();
            }
        } else {
            container.innerHTML = '<p class="text-center">등록된 질문이 없습니다.</p>';
        }
        /*]]>*/
    </script>
</body>
</html>
