<!DOCTYPE html>
<!-- lang 은 이 레이아웃에만 둔다. 콘텐츠 템플릿의 <html> 태그는 레이아웃 방언이
     버리므로 거기에 적으면 렌더 결과에 남지 않는다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 아래 메타는 SeoMetaInterceptor 가 채우는 ${seo} 를 따른다.
         컨트롤러가 값을 지정하지 않은 페이지에는 사이트 기본값이 들어간다.
         하드코딩으로 되돌리지 말 것: 전 페이지가 같은 description 을 쓰면
         검색엔진이 중복 콘텐츠로 판단한다. -->
    <meta name="description" th:content="${seo?.description}">
    <meta name="robots" th:content="${seo?.robots} ?: 'index, follow'">
    <link rel="canonical" th:if="${seo != null}" th:href="${seo.canonical}">

    <!-- Open Graph / SNS Share -->
    <meta property="og:type" th:content="${seo?.ogType} ?: 'website'">
    <meta property="og:site_name" content="문답">
    <meta property="og:title" th:content="${seo?.title}">
    <meta property="og:description" th:content="${seo?.description}">
    <meta property="og:image" th:content="${seo?.image}">
    <meta property="og:url" th:content="${seo?.canonical}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${seo?.title}">
    <meta name="twitter:description" th:content="${seo?.description}">
    <meta name="twitter:image" th:content="${seo?.image}">

    <!-- google seacrh -->
    <meta name="google-site-verification" content="XyiaKYwTkRMZ-SPFLtteHO2m9HKfOvhcMCIGTeIduXA" />

    <!-- Google Analytics 4.
         analytics.ga4-id 가 비어 있으면 스니펫 자체를 내보내지 않는다. 로컬·테스트에서
         운영 통계를 오염시키지 않기 위한 것이라, 측정 ID 를 코드에 하드코딩하지 말 것.
         화면 코드는 gtag 를 직접 부르지 않고 analytics.js 의 mdTrack 을 쓴다(이 블록이
         없을 때 ReferenceError 로 죽지 않게 하기 위해).

         th:with 는 th:if 보다 나중에 처리되므로 한 태그에 같이 쓸 수 없다. 그래서 중첩한다. -->
    <th:block th:with="ga4Id=${@environment.getProperty('analytics.ga4-id')}">
        <th:block th:if="${!#strings.isEmpty(ga4Id)}">
            <script async th:src="'https://www.googletagmanager.com/gtag/js?id=' + ${ga4Id}"></script>
            <script th:inline="javascript">
                window.dataLayer = window.dataLayer || [];
                function gtag() { dataLayer.push(arguments); }
                gtag('js', new Date());
                gtag('config', /*[[${ga4Id}]]*/ '');
            </script>
        </th:block>
    </th:block>

    <!-- google ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5509463812555494"
     crossorigin="anonymous"></script>

    <!-- link -->
    <th:block th:replace="~{fragment/link::link}"></th:block>
</head>
<body>
    <!-- 로딩 오버레이 (프리미엄 글래스모피즘 디자인) -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner-container">
                <div class="custom-spinner"></div>
                <div class="spinner-core"></div>
            </div>
            <h4 class="loading-title">문답을 준비하고 있습니다</h4>
            <p class="loading-subtext">잠시만 기다려주세요...</p>
        </div>
    </div>

    <!-- 대기 화면 스타일은 main.css 의 '대기 화면' 절에 있다. -->

    <!-- header -->
    <th:block th:replace="~{fragment/header::header}"></th:block>

    <!-- ⭐ content -->
    <!-- layout:fragment="레이아웃의 프레그먼트 영역 이름" -->
    <th:block layout:fragment="content"></th:block>
    
    <!-- footer -->
    <th:block th:replace="~{fragment/footer::footer}"></th:block>

    <!-- script -->
    <th:block th:replace="~{fragment/script::script}"></th:block>
</body>
</html>
