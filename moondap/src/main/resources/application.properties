spring.application.name=moondap

# --- Profile Settings ---
# 로컬 개발 시: dev / 배포 시: prod 로 변경
spring.profiles.active=prod

# --- SEO ---
# canonical, og:image, sitemap.xml 의 절대 URL 기준.
# 로컬에서도 운영 도메인을 그대로 둔다. 이 값이 localhost 면 개발 중 실수로 배포됐을 때
# 크롤러에게 잘못된 정규 URL 을 알려주게 되고, 그 피해가 되돌리기 어렵다.
app.base-url=https://moondap.com

# --- Analytics ---
# GA4 측정 ID. 비밀값이 아니라 페이지 소스에 그대로 노출되는 공개 값이다.
# 기본값을 비워 두는 것은 의도다 — 값이 없으면 main_layout 이 gtag 스니펫 자체를
# 렌더하지 않으므로, 로컬·테스트 트래픽이 운영 통계에 섞이지 않는다.
# 운영에는 application-prod.properties 나 환경변수(GA4_MEASUREMENT_ID)로 주입한다.
analytics.ga4-id=${GA4_MEASUREMENT_ID:}

# --- Server Settings (HTTPS & Proxy) ---
# Cafe24 등 프록시 뒤에서 HTTPS 정보를 정확히 인식하기 위한 설정
server.forward-headers-strategy=framework

# --- DataSource Core ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 커넥션 풀 설정 (운영 안정화)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=2000
spring.datasource.hikari.pool-name=MoondapHikariPool

# Mybatis 설정
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:com/moondap/mybatis/mapper/*.xml

# 관리자 가입 보안 키
admin.secret-key=MOONDAP_ADMIN_2026

# 업로드 용량 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-parameter-count=2000
server.tomcat.max-multipart-form-data-part-count=2000

# MVC 에러 처리
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
