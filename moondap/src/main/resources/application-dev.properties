# [DEVELOPMENT] application-dev.properties
# 개발 기본값은 로컬 DB 다. dev 프로파일이 운영 DB(moondap.com)를 가리키면
# 로컬에서 앱을 켜는 것만으로 운영 데이터에 붙어버리므로 기본값을 뒤집는다.
# 원격을 봐야 할 때만 DB_URL 환경변수로 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moondap?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&autoReconnection=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# Local File Upload Path (Mac)
file.upload-dir=/Users/kookyochan/mdUploads/contents/
file.profile-dir=/Users/kookyochan/mdUploads/profiles/

# Logging
logging.level.com.moondap=DEBUG
